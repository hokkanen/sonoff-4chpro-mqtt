name: Source checks and ESP8285 build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24, runner >= 2.327.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; Node 24, runner >= 2.327.1
        with:
          python-version: "3.12"
      - name: Install pinned host dependencies outside the checkout
        run: python -m pip install -r requirements-check.txt -r requirements-build.txt
      - name: Offline tests and source review checks
        run: python tools/check.py --sanitizers
      - name: Fresh build with matching source bundle
        run: >-
          python tools/build.py
          --work-dir "$RUNNER_TEMP/sonoff-work"
          --output-dir "$RUNNER_TEMP/sonoff-artifacts"
          --jobs 4
